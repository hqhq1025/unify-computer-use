name: repo-hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: 仓库基础卫生
        run: ./scripts/check-repo-hygiene.sh
      - name: GitHub Action 固定 SHA
        run: ./scripts/check-action-pinning.sh
      - name: shell 语法
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
